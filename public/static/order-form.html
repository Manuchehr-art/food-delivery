<!doctype html>
<html lang="tg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Оформление заказа — FoodGo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&family=Unbounded:wght@700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
  <link href="../assets/css/app.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg app-navbar">
  <div class="container">
    <a class="navbar-brand" href="layout.html">Food<span>Go</span> · Болаззат</a>
    <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse" data-bs-target="#mainNav"
            aria-controls="mainNav" aria-expanded="false" aria-label="Меню">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="layout.html">Асосӣ</a></li>
        <li class="nav-item"><a class="nav-link" href="restaurants.html">Ресторанҳо</a></li>
        <li class="nav-item"><a class="nav-link active" aria-current="page" href="order-form.html">Фармоиш</a></li>
      </ul>
      <div class="d-flex gap-2">
        <a class="btn btn-primary" href="#">Ворид шудан</a>
      </div>
    </div>
  </div>
</nav>

<main class="container py-4">

  <nav aria-label="Навигационная цепочка">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="restaurants.html" class="text-decoration-none" style="color:var(--mu)">Ресторанҳо</a></li>
      <li class="breadcrumb-item active" aria-current="page">Оформление заказа</li>
    </ol>
  </nav>

  <h1 class="mb-4">Оформление заказа</h1>

  <form id="order-form" class="card card-body" method="post" action="/orders/create" novalidate>

    <div class="mb-3">
      <label class="form-label" for="restaurant_id">Ресторан *</label>
      <select class="form-select" id="restaurant_id" name="restaurant_id"
              required aria-describedby="restaurant_id-error">
        <option value="">Выберите ресторан</option>
        <option value="1">Пиццаи Олӣ</option>
        <option value="2">Бургер Хаус</option>
        <option value="3">Оши Марказӣ</option>
        <option value="4">Салати Сабз</option>
      </select>
      <div class="invalid-feedback" id="restaurant_id-error"></div>
    </div>

    <div class="mb-3">
      <label class="form-label" for="address">Адрес доставки *</label>
      <input class="form-control" type="text" id="address" name="address"
             required maxlength="200"
             placeholder="ш. Душанбе, кӯчаи Рӯдакӣ 42"
             aria-describedby="address-error">
      <div class="invalid-feedback" id="address-error"></div>
    </div>

    <div class="mb-3">
      <label class="form-label" for="phone">Телефон *</label>
      <input class="form-control" type="tel" id="phone" name="phone"
             required pattern="[0-9+\(\)\s\-]{9,20}"
             placeholder="+992 90 123 45 67"
             aria-describedby="phone-error">
      <div class="invalid-feedback" id="phone-error"></div>
    </div>

    <div class="row g-3 mb-3">
      <div class="col-sm-6">
        <label class="form-label" for="delivery_date">Дата доставки *</label>
        <input class="form-control" type="date" id="delivery_date" name="delivery_date"
               required aria-describedby="delivery_date-error">
        <div class="invalid-feedback" id="delivery_date-error"></div>
      </div>
      <div class="col-sm-6">
        <label class="form-label" for="delivery_time">Время доставки *</label>
        <input class="form-control" type="time" id="delivery_time" name="delivery_time"
               required aria-describedby="delivery_time-error">
        <div class="invalid-feedback" id="delivery_time-error"></div>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label" for="note">Комментарий к заказу</label>
      <textarea class="form-control" id="note" name="note"
                maxlength="255" rows="3"
                placeholder="Например: без лука, позвонить за 10 минут"
                aria-describedby="note-error note-hint"></textarea>
      <div class="invalid-feedback" id="note-error"></div>
      <div class="form-text text-muted" id="note-hint">Не более 255 символов</div>
    </div>

    <div class="alert alert-info" role="alert">
      <strong>Минимальная сумма заказа:</strong> 30 сомони.
      Текущая сумма: <span id="order-total" style="color:var(--sf);font-weight:700">25.00 с.</span>
    </div>

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary">Оформить заказ</button>
      <a href="restaurants.html" class="btn btn-outline-light">Отмена</a>
    </div>

  </form>

</main>

<footer class="app-footer">
  <div class="container text-center">
    <p class="mb-0">FoodGo © 2026</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<script type="module" src="../assets/js/app.js"></script>
</body>
</html>
