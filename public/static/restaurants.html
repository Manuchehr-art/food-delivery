<!doctype html>
<html lang="tg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ресторанҳо — FoodGo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&family=Unbounded:wght@700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
  <link href="../assets/css/app.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg app-navbar">
  <div class="container">
    <a class="navbar-brand" href="layout.html">Food<span>Go</span> · Болаззат</a>
    <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse" data-bs-target="#mainNav"
            aria-controls="mainNav" aria-expanded="false" aria-label="Меню">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="layout.html">Асосӣ</a></li>
        <li class="nav-item"><a class="nav-link active" aria-current="page" href="restaurants.html">Ресторанҳо</a></li>
        <li class="nav-item"><a class="nav-link" href="order-form.html">Фармоиш</a></li>
      </ul>
      <div class="d-flex gap-2">
        <a class="btn btn-primary" href="#">Ворид шудан</a>
      </div>
    </div>
  </div>
</nav>

<main class="container py-4">

  <h1 class="mb-4">Ресторанҳо</h1>

  <form class="card card-body mb-4" method="get" action="restaurants.html" role="search">
    <div class="row g-2">
      <div class="col-12 col-md-6">
        <label class="visually-hidden" for="restaurant-search">Поиск по названию</label>
        <input class="form-control" type="search" id="restaurant-search" name="q"
               placeholder="Поиск по названию..." autocomplete="off">
      </div>
      <div class="col-6 col-md-3">
        <label class="visually-hidden" for="category">Категория</label>
        <select class="form-select" id="category" name="category">
          <option value="">Все категории</option>
          <option value="Пицца">Пицца</option>
          <option value="Бургер">Бургер</option>
          <option value="Миллӣ">Миллӣ</option>
          <option value="Салат">Салат</option>
          <option value="Японӣ">Японӣ</option>
        </select>
      </div>
      <div class="col-6 col-md-3 d-grid">
        <button class="btn btn-primary" type="submit">Найти</button>
      </div>
    </div>
  </form>

  <p id="restaurant-search-status" class="small text-muted" aria-live="polite"></p>

  <div class="card">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead>
          <tr>
            <th scope="col">Название</th>
            <th scope="col">Категория</th>
            <th scope="col">Рейтинг</th>
            <th scope="col" class="d-none d-md-table-cell">Время</th>
            <th scope="col">Статус</th>
            <th scope="col"><span class="visually-hidden">Действия</span></th>
          </tr>
        </thead>
        <tbody id="restaurants-tbody">
          <!-- Заполняется через JavaScript -->
        </tbody>
      </table>
    </div>
  </div>

  <nav aria-label="Страницы" class="mt-4">
    <ul class="pagination justify-content-center">
      <li class="page-item disabled"><a class="page-link" href="#">←</a></li>
      <li class="page-item active"><a class="page-link" href="#">1</a></li>
      <li class="page-item"><a class="page-link" href="#">2</a></li>
      <li class="page-item"><a class="page-link" href="#">→</a></li>
    </ul>
  </nav>

</main>

<footer class="app-footer">
  <div class="container text-center">
    <p class="mb-0">FoodGo © 2026</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<script type="module" src="../assets/js/app.js"></script>
</body>
</html>
